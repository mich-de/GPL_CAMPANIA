# Bozza di metadata F-Droid per GPL Campania.
#
# Questo file NON va nel repo dell'app: F-Droid vuole i metadata in un file
# separato dentro il loro repo "fdroiddata" (gitlab.com/fdroid/fdroiddata),
# nel path metadata/it.michdeangelis.gplcampania.yml. Questo file qui è solo
# la bozza di partenza da copiare in una merge request su quel repo.
#
# Prossimi passi manuali (da fare con un account GitLab):
# 1. Fai fork di https://gitlab.com/fdroid/fdroiddata
# 2. Il tag v1.1.0 è già stato creato e pushato su GPL_CAMPANIA (commit sotto).
# 3. Copia questo contenuto in metadata/it.michdeangelis.gplcampania.yml nel
#    tuo fork di fdroiddata, apri una merge request.
# 4. Segui la guida ufficiale:
#    https://f-droid.org/docs/Submitting_to_F-Droid_Quick_Start_Guide/

Categories:
  - Navigation
  - Money
License: MIT
