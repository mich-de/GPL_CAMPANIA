# Bozza di metadata F-Droid per GPL Campania.
#
# Questo file NON va nel repo dell'app: F-Droid vuole i metadata in un file
# separato dentro il loro repo "fdroiddata" (gitlab.com/fdroid/fdroiddata),
# nel path metadata/it.michdeangelis.gplcampania.yml. Questo file qui è solo
# la bozza di partenza da copiare in una merge request su quel repo.
#
# Prossimi passi manuali (da fare con un account GitLab):
# 1. Fai fork di https://gitlab.com/fdroid/fdroiddata
# 2. Crea il commit git taggato (es. `git tag v1.1.0 && git push origin v1.1.0`)
#    sul repo GPL_CAMPANIA, e sostituisci TAG_DA_CREARE sotto con quel tag o
#    con l'hash del commit.
# 3. Copia questo contenuto in metadata/it.michdeangelis.gplcampania.yml nel
#    tuo fork di fdroiddata, aggiusta commit/tag, apri una merge request.
# 4. Segui la guida ufficiale:
#    https://f-droid.org/docs/Submitting_to_F-Droid_Quick_Start_Guide/

Categories:
  - Navigation
  - Money
License: MIT
AuthorName: mich-de
SourceCode: https://github.com/mich-de/GPL_CAMPANIA
IssueTracker: https://github.com/mich-de/GPL_CAMPANIA/issues

RepoType: git
Repo: https://github.com/mich-de/GPL_CAMPANIA.git

Builds:
  - versionName: 1.1.0
    versionCode: 2
    commit: TAG_DA_CREARE  # sostituire col tag/commit reale dopo il rilascio
    subdir: app
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.1.0
CurrentVersionCode: 2
